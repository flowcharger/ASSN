# Tname: Build ASSN APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Find the project
        run: |
          if [ -f project.zip ]; then
            unzip -q project.zip -d assn_project
            found=$(find assn_project -maxdepth 3 -name settings.gradle | head -n 1)
            if [ -z "$found" ]; then
              echo "settings.gradle was not found inside project.zip"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$found")" >> "$GITHUB_ENV"
          elif [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "No project.zip and no settings.gradle in the repository"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ASSN.apk

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: ASSN-apk
          path: ASSN.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ASSN build ${{ github.run_number }}
          files: ASSN.apkhis is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
